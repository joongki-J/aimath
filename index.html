<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="인공지능 수학 연수 자료 링크 모음">
  <!-- 이 파일은 고치지 않아도 됩니다. 이름·문구는 site-config.js에서 바꿉니다. -->
  <title>인공지능 수학 연수</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="#top">
        <strong data-site="name">인공지능 수학 연수</strong>
        <small data-site="englishName">AI MATHEMATICS WORKSHOP</small>
      </a>

      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="#tools">자료 찾기</a>
        <a href="#schedule">연수 일정</a>
        <button class="outline-pill" id="siteQrBtn" type="button">접속 QR</button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero-section">
      <div class="hero-grid-bg" aria-hidden="true"></div>
      <span class="hero-square lime-square" aria-hidden="true"></span>
      <span class="hero-square peach-square" aria-hidden="true"></span>

      <div class="hero-layout">
        <div class="hero-copy">
          <p class="eyebrow"><span></span><b data-site="eyebrow" style="font-weight:inherit">2박 3일 연수</b></p>

          <h1 class="hero-title">
            <span data-site="heroLine1">수학을</span><br>
            <span class="highlight" data-site="heroHighlight">보이게</span> <span data-site="heroLine2">만들다</span>
          </h1>

          <p class="hero-desc" data-site="heroDesc">
            연수 자료 링크 모음입니다.
          </p>

          <div class="hero-actions">
            <a class="primary-pill" href="#tools">자료 바로가기 <span>↘</span></a>
            <a class="outline-pill link-pill" href="#schedule">연수 일정 보기</a>
          </div>

          <div class="hero-stats">
            <span><b id="toolCount">0</b>개 자료</span>
            <i></i>
            <span><b>3</b>일 일정</span>
            <i></i>
            <span>QR로 바로 접속</span>
          </div>
        </div>

        <div class="hero-art">
          <canvas id="reelCanvas" role="img" aria-label="연필 선 하나가 곡선, 원·삼각형·사각형·육각형, 벌집, 곱셈 원으로 바뀌었다가 다시 선으로 돌아오는 12초 모션 그래픽"></canvas>
        </div>
      </div>
    </section>

    <section class="tools-section" id="tools">
      <div class="section-inner">
        <div class="section-heading">
          <div>
            <p class="section-kicker">MATERIALS &amp; LINKS</p>
            <h2>연수 자료 찾기</h2>
            <p>일차나 종류를 고르거나 검색해서 필요한 자료를 바로 여세요.</p>
          </div>
          <div class="tool-number"><span id="filteredCount">0</span> LINKS</div>
        </div>

        <div class="finder">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="검색">
          </label>
          <button class="reset-btn" id="resetBtn" type="button">초기화</button>
        </div>

        <div class="subject-groups" id="subjectGroups"></div>
        <div class="tools-grid" id="toolsGrid"></div>

        <p class="empty-message" id="emptyMessage" hidden>
          조건에 맞는 자료가 없습니다.
        </p>
      </div>
    </section>

    <section class="how-section" id="schedule">
      <div class="how-grid-bg" aria-hidden="true"></div>
      <div class="schedule-layout">
        <div class="schedule-head">
          <div>
            <p class="how-eyebrow"><span></span>연수 일정</p>
            <h2 class="how-title">2박 3일<br><em>한눈에 보기</em></h2>
          </div>
          <dl class="info-list" id="infoList"></dl>
        </div>

        <div class="day-grid" id="dayGrid"></div>
      </div>
    </section>
  </main>

  <footer>
    <div>© <span data-site="name">인공지능 수학 연수</span>. All rights reserved.</div>
  </footer>

  <div class="modal" id="qrModal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="qr-dialog" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
      <p class="qr-kicker">QUICK ACCESS</p>
      <h3 id="qrTitle">접속 QR</h3>
      <div class="qr-box" id="qrCode"></div>
      <p class="qr-url" id="qrUrl"></p>
      <div class="qr-actions">
        <button class="outline-pill" id="copyUrlBtn" type="button">주소 복사</button>
        <button class="primary-pill button-reset" data-close-modal type="button">닫기</button>
      </div>
    </section>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./site-config.js"></script>
<script src="./script.js"></script>
<script src="./hero-reel.js"></script>
</body>
</html>
